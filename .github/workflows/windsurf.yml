name: Download and Release File

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download Windsurf Installer
        run: |
          curl -L -o WindsurfUserSetup-x64-1.9.0.exe \
          https://windsurf-stable.codeiumdata.com/win32-x64-user/stable/fbebfca390b10f7a152fd231f94606109d576e12/WindsurfUserSetup-x64-1.9.0.exe

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WindsurfUserSetup-x64-1.9.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
